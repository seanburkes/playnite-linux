name: legacy-oracle

on:
  workflow_dispatch:
  push:
    tags: ["oracle-*"]
  pull_request:
    paths:
      - "legacy/**"
      - "oracle-lock/**"
      - "tests/golden/**"
      - "tests/fixtures/**"
      - ".github/workflows/legacy-oracle.yml"

permissions:
  contents: read

jobs:
  windows-oracle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - uses: microsoft/setup-msbuild@v2

      - name: Pin and verify Playnite.Deps
        shell: pwsh
        run: ./oracle-lock/fetch.ps1

      - name: Restore legacy solution
        shell: pwsh
        run: dotnet restore legacy/source/Playnite.slnx

      - name: Build legacy (x86, Release)
        shell: pwsh
        run: |
          msbuild legacy/source/Playnite.slnx `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /m `
            /verbosity:minimal `
            /binaryLogger:legacy-build.binlog

      - name: Restore legacy oracle harness
        shell: pwsh
        run: dotnet restore tools/LegacyOracle/LegacyOracle.csproj

      - name: Build legacy oracle harness
        shell: pwsh
        run: |
          msbuild tools/LegacyOracle/LegacyOracle.csproj `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /m `
            /verbosity:minimal

      - name: Emit manifest and theme goldens
        shell: pwsh
        run: |
          $exe = Get-ChildItem tools/LegacyOracle/bin -Recurse -Filter LegacyOracle.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$exe) { throw "LegacyOracle.exe not found" }
          New-Item -ItemType Directory -Force -Path tests/golden/manifests | Out-Null
          & $exe.FullName manifest legacy/source/Tests/TestPlugin/extension.yaml |
            Out-File -Encoding utf8NoBOM tests/golden/manifests/TestPlugin.extension.yaml
          & $exe.FullName manifest legacy/source/Tests/TestGameLibrary/extension.yaml |
            Out-File -Encoding utf8NoBOM tests/golden/manifests/TestGameLibrary.extension.yaml
          Get-ChildItem tests/golden/manifests | ForEach-Object { Get-Content $_.FullName }

      - name: Locate legacy test assembly
        shell: pwsh
        run: |
          Get-ChildItem legacy/source/Tests/Playnite.Tests/bin -Recurse -Filter Playnite.Tests.dll |
            ForEach-Object { Write-Host $_.FullName }

      - name: Run legacy NUnit suite (VSTest)
        shell: pwsh
        run: |
          $dll = Get-ChildItem legacy/source/Tests/Playnite.Tests/bin -Recurse -Filter Playnite.Tests.dll |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$dll) { throw "Playnite.Tests.dll not found" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" |
            Select-Object -First 1
          if (!$vstest) {
            $vstest = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter vstest.console.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$vstest) { throw "vstest.console.exe not found" }

          $filter = "FullyQualifiedName!~CanWriteToFolderTest&FullyQualifiedName!~OverUnsafeWorksTest"
          & $vstest $dll.FullName `
            /Logger:trx `
            /ResultsDirectory:"${{ runner.temp }}/test-results" `
            /TestAdapterPath:"$($dll.DirectoryName)" `
            /TestCaseFilter:$filter

      - name: Record executed test counts
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem "${{ runner.temp }}/test-results" -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$trx) { Write-Host "no trx found"; exit 0 }
          [xml]$xml = Get-Content $trx.FullName
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
          $counters = $xml.SelectSingleNode("//t:ResultSummary/t:Counters", $ns)
          $result = [ordered]@{
            captured_at = (Get-Date).ToUniversalTime().ToString("o")
            run_id = "${{ github.run_id }}"
            total = [int]$counters.GetAttribute("total")
            executed = [int]$counters.GetAttribute("executed")
            passed = [int]$counters.GetAttribute("passed")
            failed = [int]$counters.GetAttribute("failed")
            skipped = [int]$counters.GetAttribute("notExecuted")
            excluded = @(
              "FileSystemTests.CanWriteToFolderTest",
              "SafeFileEnumeratorTests.OverUnsafeWorksTest"
            )
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content "${{ runner.temp }}/test-counts.json"
          $result | ConvertTo-Json -Depth 4 | Write-Host

      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-oracle
          path: |
            legacy-build.binlog
            ${{ runner.temp }}/test-results/**
            ${{ runner.temp }}/test-counts.json
            tests/golden/manifests/**
          if-no-files-found: warn
