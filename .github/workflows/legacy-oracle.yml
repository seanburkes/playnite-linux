name: legacy-oracle

on:
  workflow_dispatch:
  push:
    tags: ["oracle-*"]
  pull_request:
    paths:
      - "legacy/**"
      - "oracle-lock/**"
      - "tests/golden/**"
      - "tests/fixtures/**"
      - "tools/LegacyOracle/**"
      - ".github/workflows/legacy-oracle.yml"
      - "!**/*.md"
      - "tests/golden/settings-library.md"
      - "tests/golden/settings/**"
      - "tests/golden/library/**"
      - "tests/golden/manifests/**"
      - "tests/fixtures/v10/**"

permissions:
  contents: read

jobs:
  windows-oracle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - uses: microsoft/setup-msbuild@v2

      - name: Pin and verify Playnite.Deps
        shell: pwsh
        run: ./oracle-lock/fetch.ps1

      - name: Restore legacy solution
        shell: pwsh
        run: dotnet restore legacy/source/Playnite.slnx

      - name: Build legacy (x86, Release)
        shell: pwsh
        run: |
          msbuild legacy/source/Playnite.slnx `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /m `
            /verbosity:minimal `
            /binaryLogger:legacy-build.binlog

      - name: Restore legacy oracle harness
        shell: pwsh
        run: dotnet restore tools/LegacyOracle/LegacyOracle.csproj

      - name: Build legacy oracle harness
        shell: pwsh
        run: |
          msbuild tools/LegacyOracle/LegacyOracle.csproj `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /m `
            /verbosity:minimal

      - name: Emit manifest goldens to a temporary directory
        shell: pwsh
        run: |
          $exe = Get-ChildItem tools/LegacyOracle/bin -Recurse -Filter LegacyOracle.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$exe) { throw "LegacyOracle.exe not found" }
          $out = Join-Path $env:RUNNER_TEMP "manifest-goldens"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $exe.FullName manifest legacy/source/Tests/TestPlugin/extension.yaml |
            Out-File -Encoding utf8NoBOM (Join-Path $out "TestPlugin.extension.yaml")
          & $exe.FullName manifest legacy/source/Tests/TestGameLibrary/extension.yaml |
            Out-File -Encoding utf8NoBOM (Join-Path $out "TestGameLibrary.extension.yaml")
          Get-ChildItem -LiteralPath $out | ForEach-Object { Get-Content $_.FullName }

      - name: Byte-compare manifest goldens and prove the comparator bites
        shell: pwsh
        run: |
          function Get-ManifestGoldenDifferences {
            param(
              [Parameter(Mandatory)][string]$Generated,
              [Parameter(Mandatory)][string]$Committed
            )
            $problems = [System.Collections.Generic.List[string]]::new()
            $committedFiles = @(Get-ChildItem -LiteralPath $Committed -File -Filter *.yaml | Sort-Object Name)
            if ($committedFiles.Count -eq 0) {
              $problems.Add("no committed manifest goldens found in $Committed")
              return ,$problems
            }
            foreach ($file in $committedFiles) {
              $candidate = Join-Path $Generated $file.Name
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                $problems.Add("$($file.Name): regenerated manifest is missing")
                continue
              }
              $expected = [System.IO.File]::ReadAllBytes($file.FullName)
              $actual = [System.IO.File]::ReadAllBytes($candidate)
              if ($expected.Length -ne $actual.Length) {
                $problems.Add("$($file.Name): byte length differs (committed $($expected.Length), regenerated $($actual.Length))")
                continue
              }
              for ($i = 0; $i -lt $expected.Length; $i++) {
                if ($expected[$i] -ne $actual[$i]) {
                  $problems.Add(("{0}: byte {1} differs (committed 0x{2:x2}, regenerated 0x{3:x2})" -f $file.Name, $i, $expected[$i], $actual[$i]))
                  break
                }
              }
            }
            $committedNames = @($committedFiles | ForEach-Object { $_.Name })
            foreach ($extra in @(Get-ChildItem -LiteralPath $Generated -File)) {
              if ($committedNames -notcontains $extra.Name) {
                $problems.Add("$($extra.Name): regenerated manifest has no committed counterpart")
              }
            }
            return ,$problems
          }

          $committedDir = "tests/golden/manifests"
          $generatedDir = Join-Path $env:RUNNER_TEMP "manifest-goldens"
          $differences = Get-ManifestGoldenDifferences -Generated $generatedDir -Committed $committedDir
          if ($differences.Count -gt 0) {
            $differences | ForEach-Object { Write-Host "GOLDEN MISMATCH: $_" }
            throw "Manifest goldens are not reproducible: $($differences.Count) difference(s). See GOLDEN MISMATCH lines."
          }
          Write-Host "Manifest goldens match committed bytes: $((Get-ChildItem -LiteralPath $committedDir -File).Count) file(s)."

          $probe = Get-ChildItem -LiteralPath $committedDir -File -Filter *.yaml |
            Sort-Object Name | Select-Object -First 1
          if (-not $probe) { throw "One-byte negative check needs a committed manifest golden." }
          $negativeDir = Join-Path $env:RUNNER_TEMP "manifest-goldens-negative"
          New-Item -ItemType Directory -Force -Path $negativeDir | Out-Null
          $mutated = Join-Path $negativeDir $probe.Name
          [System.IO.File]::Copy($probe.FullName, $mutated, $true)
          $bytes = [System.IO.File]::ReadAllBytes($mutated)
          if ($bytes.Length -lt 1) { throw "One-byte negative check needs a non-empty golden: $($probe.Name)." }
          $bytes[0] = [byte]($bytes[0] -bxor 0x01)
          [System.IO.File]::WriteAllBytes($mutated, $bytes)
          $negativeDifferences = Get-ManifestGoldenDifferences -Generated $negativeDir -Committed $committedDir
          if ($negativeDifferences.Count -eq 0) {
            throw "One-byte negative check did not bite: a copy of $($probe.Name) with one flipped byte was accepted."
          }
          $named = @($negativeDifferences | Where-Object { $_ -like "$($probe.Name):*" })
          if ($named.Count -eq 0) {
            throw "One-byte negative check failed without naming $($probe.Name): $($negativeDifferences -join '; ')"
          }
          Write-Host "One-byte negative check passed: $($negativeDifferences -join '; ')"

      - name: Locate legacy test assembly
        shell: pwsh
        run: |
          Get-ChildItem legacy/source/Tests/Playnite.Tests/bin -Recurse -Filter Playnite.Tests.dll |
            ForEach-Object { Write-Host $_.FullName }

      - name: Run legacy NUnit suite (VSTest)
        shell: pwsh
        run: |
          $dll = Get-ChildItem legacy/source/Tests/Playnite.Tests/bin -Recurse -Filter Playnite.Tests.dll |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$dll) { throw "Playnite.Tests.dll not found" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" |
            Select-Object -First 1
          if (!$vstest) {
            $vstest = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter vstest.console.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$vstest) { throw "vstest.console.exe not found" }

          $filter = "FullyQualifiedName!~CanWriteToFolderTest&FullyQualifiedName!~OverUnsafeWorksTest&FullyQualifiedName!~ProcessStarterTests.ShellExecuteTest"
          & $vstest $dll.FullName `
            /Logger:trx `
            /ResultsDirectory:"${{ runner.temp }}/test-results" `
            /TestAdapterPath:"$($dll.DirectoryName)" `
            /TestCaseFilter:$filter

      - name: Record executed test counts
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem "${{ runner.temp }}/test-results" -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$trx) { Write-Host "no trx found"; exit 0 }
          [xml]$xml = Get-Content $trx.FullName
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
          $counters = $xml.SelectSingleNode("//t:ResultSummary/t:Counters", $ns)
          $result = [ordered]@{
            captured_at = (Get-Date).ToUniversalTime().ToString("o")
            run_id = "${{ github.run_id }}"
            total = [int]$counters.GetAttribute("total")
            executed = [int]$counters.GetAttribute("executed")
            passed = [int]$counters.GetAttribute("passed")
            failed = [int]$counters.GetAttribute("failed")
            skipped = [int]$counters.GetAttribute("notExecuted")
            excluded = @(
              "FileSystemTests.CanWriteToFolderTest",
              "SafeFileEnumeratorTests.OverUnsafeWorksTest",
              "ProcessStarterTests.ShellExecuteTest"
            )
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content "${{ runner.temp }}/test-counts.json"
          $result | ConvertTo-Json -Depth 4 | Write-Host

      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-oracle
          path: |
            legacy-build.binlog
            ${{ runner.temp }}/test-results/**
            ${{ runner.temp }}/test-counts.json
            ${{ runner.temp }}/manifest-goldens/**
          if-no-files-found: warn
