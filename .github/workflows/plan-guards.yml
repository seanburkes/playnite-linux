name: plan-guards

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  PROTECTED_PATHS: >-
    tests/golden tests/fixtures tests/baseline.json docs/formal
    docs/port/surface-parity.tsv tools/LegacyOracle tools/V10LibraryFixture
    .github/workflows/linux-ci.yml .github/workflows/plan-guards.yml
    .github/CODEOWNERS scripts/ci

jobs:
  inventory-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the comparison base commit
        id: policy_base
        run: |
          base=$(python3 scripts/ci/resolve_base_sha.py \
            --event "${{ github.event_name }}" \
            --pull-request-base "${{ github.event.pull_request.base.sha }}" \
            --merge-group-base "${{ github.event.merge_group.base_sha }}" \
            --push-before "${{ github.event.before }}")
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Materialise the base policy scripts
        id: policy_scripts
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/base-policy"
          archived=0
          if [ -n "${BASE_SHA:-}" ] && { \
            git cat-file -e "$BASE_SHA:scripts/ci/check_linux_test_results.py" 2>/dev/null || \
            git cat-file -e "$BASE_SHA:scripts/ci/check_protected_paths.py" 2>/dev/null; }; then
            rm -rf "$root"
            mkdir -p "$root"
            git archive --format=tar "$BASE_SHA" scripts/ci | tar -x -C "$root"
            archived=1
          fi
          for spec in "checker:check_linux_test_results.py" \
                      "gate:check_protected_paths.py"; do
            key=${spec%%:*}
            script=${spec#*:}
            if [ -n "${BASE_SHA:-}" ] && \
               git cat-file -e "$BASE_SHA:scripts/ci/$script" 2>/dev/null; then
              if [ "$archived" -ne 1 ] || [ ! -f "$root/scripts/ci/$script" ]; then
                echo "::error::Base commit contains scripts/ci/$script but it could not be materialised"
                exit 1
              fi
              printf '%s=%s\n' "$key" "$root/scripts/ci/$script" >> "$GITHUB_OUTPUT"
              printf '%s_source=base\n' "$key" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::BOOTSTRAP: base commit has no scripts/ci/$script; running the head copy for this transition only"
              printf '%s=%s\n' "$key" "scripts/ci/$script" >> "$GITHUB_OUTPUT"
              printf '%s_source=head\n' "$key" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Frozen snapshot and dependency pin are unconditionally immutable
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group'
        run: |
          changed=$(git diff --name-only \
            "${{ steps.policy_base.outputs.sha }}" HEAD -- legacy oracle-lock)
          if [ -n "$changed" ]; then
            echo "::error::legacy/ and oracle-lock/ are frozen; no label overrides this."
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Oracle artifacts require an explicit oracle-change PR
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'oracle-change')
        run: |
          python3 "${{ steps.policy_scripts.outputs.gate }}" \
            --base "${{ steps.policy_base.outputs.sha }}" \
            --paths $PROTECTED_PATHS

      - name: Oracle artifacts require an explicit oracle-change merge-queue entry
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${{ github.event.merge_group.head_ref }}"
          pr=$(printf '%s' "$ref" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')
          if [ -z "$pr" ]; then
            echo "::error::Cannot resolve the pull request from merge-group ref $ref"
            exit 1
          fi
          labels=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx 'oracle-change'; then
            echo "oracle-change label present for PR $pr"
            exit 0
          fi
          python3 "${{ steps.policy_scripts.outputs.gate }}" \
            --base "${{ steps.policy_base.outputs.sha }}" \
            --paths $PROTECTED_PATHS

      - name: Inventory is reproducible
        run: |
          python3 scripts/port/scan_legacy.py --format md > /tmp/inventory.md
          diff -u docs/port/01-INVENTORY.generated.md /tmp/inventory.md

      - name: Parity ledger is valid
        run: python3 scripts/port/check_parity.py

      - name: Port index generator tests
        run: python3 -m unittest discover -s scripts/port -p 'test_*.py'

      - name: Port aggregates are generated on main
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group'
        run: |
          base="${{ steps.policy_base.outputs.sha }}"
          # Aggregates are a parent-owned single-writer artifact: the post-merge
          # port-index workflow regenerates and commits them on main. A pull
          # request owns only its unit shards, so even a correctly regenerated
          # aggregate change fails here.
          python3 scripts/port/build_port_index.py check --shards-only \
            --against "$base" --forbid-aggregate-changes

      - name: Port shards are valid and history is preserved
        run: |
          ref="${{ steps.policy_base.outputs.sha }}"
          args=(--shards-only)
          if [ -n "$ref" ] && ! printf '%s' "$ref" | grep -Eq '^0+$'; then
            if git cat-file -e "$ref:docs/port/units" 2>/dev/null; then
              args+=(--against "$ref")
            else
              echo "::notice::base $ref predates docs/port/units; acknowledging the migration-only history skip"
              args+=(--against "$ref" --allow-pre-migration-base)
            fi
          fi
          python3 scripts/port/build_port_index.py check "${args[@]}"

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch tla2tools
        run: |
          mkdir -p "$RUNNER_TEMP/tla"
          curl -sSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Check TLA+ models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla/tla2tools.jar
        run: scripts/formal/run_tlc.sh
