name: plan-guards

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  PROTECTED_PATHS: >-
    tests/golden tests/fixtures tests/baseline.json docs/formal
    docs/port/surface-parity.tsv docs/port/02-ARCHITECTURE.md docs/port/PORTING.md
    docs/port/BenchmarkHarnessAllowlist.props BannedSymbols*.txt
    src/Playnite.SDK.Abstractions/PublicAPI.Shipped.txt
    src/Playnite.SDK.Abstractions/PublicAPI.Unshipped.txt
    src/Playnite.SDK.Abstractions/api-baseline
    tools/LegacyOracle tools/V10LibraryFixture
    .github/workflows packaging
    .github/CODEOWNERS scripts/ci scripts/port scripts/formal
    docs/port/LOCAL-PATH-EXCEPTIONS.md

jobs:
  inventory-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the comparison base commit
        id: policy_base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) event_base="$PULL_REQUEST_BASE" ;;
            merge_group) event_base="$MERGE_GROUP_BASE" ;;
            push) event_base="$PUSH_BEFORE" ;;
            *)
              echo "::error::Unsupported event $EVENT_NAME; cannot resolve a policy base"
              exit 1
              ;;
          esac
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$event_base" ] || printf '%s' "$event_base" | grep -Eq '^0+$'; then
              event_base=""
            fi
          elif [ -z "$event_base" ] || printf '%s' "$event_base" | grep -Eq '^0+$'; then
            echo "::error::$EVENT_NAME event has no usable base SHA; refusing to open the first-baseline path"
            exit 1
          fi
          if [ -n "$event_base" ]; then
            if ! git cat-file -e "$event_base^{commit}" 2>/dev/null; then
              echo "::error::Event base $event_base is not a commit in this checkout"
              exit 1
            fi
            if ! fork=$(git merge-base "$event_base" HEAD); then
              echo "::error::Cannot compute the fork point of $event_base and HEAD"
              exit 1
            fi
            if [ -z "$fork" ]; then
              echo "::error::Cannot compute the fork point of $event_base and HEAD"
              exit 1
            fi
          else
            fork=""
          fi
          printf 'sha=%s\nrecorded=%s\n' "$fork" "$event_base" >> "$GITHUB_OUTPUT"

      - name: Select the policy materialiser
        id: policy_materialiser
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && \
             git cat-file -e "$BASE_SHA:scripts/ci/materialise_policy.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/materialise_policy.sh" \
              > "$RUNNER_TEMP/materialise_policy.sh"
            printf 'path=%s\n' "$RUNNER_TEMP/materialise_policy.sh" >> "$GITHUB_OUTPUT"
            printf 'source=base\n' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BOOTSTRAP: base commit has no scripts/ci/materialise_policy.sh; using the head materialiser for this transition only"
            printf 'path=%s\n' "scripts/ci/materialise_policy.sh" >> "$GITHUB_OUTPUT"
            printf 'source=head\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialise the base policy scripts
        id: policy_scripts
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
          MATERIALISER: ${{ steps.policy_materialiser.outputs.path }}
        run: |
          bash "$MATERIALISER" "$BASE_SHA" "$RUNNER_TEMP" "$GITHUB_OUTPUT"

      - name: Frozen snapshot and dependency pin are unconditionally immutable
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group'
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ steps.policy_scripts.outputs.gate }}" \
            --base "${{ steps.policy_base.outputs.sha }}" \
            --paths legacy oracle-lock \
            --error "legacy/ and oracle-lock/ are frozen; no label overrides this."

      - name: Oracle artifacts require an explicit oracle-change PR
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'oracle-change')
        run: |
          python3 "${{ steps.policy_scripts.outputs.gate }}" \
            --base "${{ steps.policy_base.outputs.sha }}" \
            --paths $PROTECTED_PATHS

      - name: Oracle artifacts require an explicit oracle-change merge-queue entry
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="${{ github.event.merge_group.head_sha }}"
          pulls="repos/${{ github.repository }}/commits/$head_sha/pulls"
          count=$(gh api "$pulls" --jq 'length')
          if [ "$count" -ne 1 ]; then
            # Batched groups do not identify one PR to label-check. Fail closed
            # with the limitation rather than silently checking a single PR.
            echo "::error::Merge group contains $count pull requests; the oracle-change label check supports exactly one PR per group. Disable batching or re-run as a single PR."
            exit 1
          fi
          pr=$(gh api "$pulls" --jq '.[0].number')
          labels=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx 'oracle-change'; then
            echo "oracle-change label present for PR $pr"
            exit 0
          fi
          python3 "${{ steps.policy_scripts.outputs.gate }}" \
            --base "${{ steps.policy_base.outputs.sha }}" \
            --paths $PROTECTED_PATHS

      - name: Inventory is reproducible
        run: |
          python3 scripts/port/scan_legacy.py --format md > /tmp/inventory.md
          diff -u docs/port/01-INVENTORY.generated.md /tmp/inventory.md

      - name: Parity ledger is valid
        run: python3 scripts/port/check_parity.py

      - name: Port index generator tests
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
        run: python3 -m unittest discover -s scripts/port -p 'test_*.py'

      - name: Port aggregates are generated on main
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group'
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
          RECORDED_BASE: ${{ steps.policy_base.outputs.recorded }}
          PORT_INDEX_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Compare against the fork point, not a stale recorded base. Main's
          # post-merge aggregate regeneration is not this PR's change. The
          # recorded event base is the other legitimate base-side snapshot.
          if [ -z "${BASE_SHA:-}" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "::error::No comparison base SHA is available for aggregate ownership"
            exit 1
          fi
          if ! merge_base=$(git merge-base "$BASE_SHA" HEAD); then
            echo "::error::Cannot compute the aggregate merge base for $BASE_SHA"
            exit 1
          fi
          if [ -z "$merge_base" ]; then
            echo "::error::Cannot compute the aggregate merge base for $BASE_SHA"
            exit 1
          fi
          # Aggregates are a parent-owned single-writer artifact: the post-merge
          # port-index workflow regenerates and commits them on main. A pull
          # request owns only its unit shards, so even a correctly regenerated
          # aggregate change fails here.
          head_tool="$PWD/scripts/port/build_port_index.py"
          if git cat-file -e "$BASE_SHA:scripts/port/build_port_index.py" 2>/dev/null; then
            base_tool="$RUNNER_TEMP/base-port/build_port_index.py"
            mkdir -p "$(dirname "$base_tool")"
            git show "$BASE_SHA:scripts/port/build_port_index.py" > "$base_tool"
            cp "$head_tool" "$RUNNER_TEMP/build_port_index.head.py"
            cp "$base_tool" "$head_tool"
            trap 'cp "$RUNNER_TEMP/build_port_index.head.py" "$head_tool"' EXIT
          else
            echo "::warning::BOOTSTRAP: base commit has no scripts/port/build_port_index.py; using the head tool"
          fi
          python3 "$head_tool" check --shards-only \
            --against "$merge_base" --forbid-aggregate-changes

      - name: Port shards are valid and history is preserved
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
        run: |
          set -euo pipefail
          ref="${BASE_SHA:-}"
          args=(--shards-only)
          if [ -n "$ref" ] && ! printf '%s' "$ref" | grep -Eq '^0+$'; then
            if ! merge_base=$(git merge-base "$ref" HEAD); then
              echo "::error::Cannot compute the shard merge base for $ref"
              exit 1
            fi
            if [ -z "$merge_base" ]; then
              echo "::error::Cannot compute the shard merge base for $ref"
              exit 1
            fi
            ref="$merge_base"
            if git cat-file -e "$ref:docs/port/units" 2>/dev/null; then
              args+=(--against "$ref")
            else
              echo "::notice::base $ref predates docs/port/units; acknowledging the migration-only history skip"
              args+=(--against "$ref" --allow-pre-migration-base)
            fi
          fi
          head_tool="$PWD/scripts/port/build_port_index.py"
          if [ -n "$ref" ] && \
             git cat-file -e "$BASE_SHA:scripts/port/build_port_index.py" 2>/dev/null; then
            base_tool="$RUNNER_TEMP/base-port/build_port_index.py"
            mkdir -p "$(dirname "$base_tool")"
            git show "$BASE_SHA:scripts/port/build_port_index.py" > "$base_tool"
            cp "$head_tool" "$RUNNER_TEMP/build_port_index.head.py"
            cp "$base_tool" "$head_tool"
            trap 'cp "$RUNNER_TEMP/build_port_index.head.py" "$head_tool"' EXIT
          else
            echo "::warning::BOOTSTRAP: base commit has no scripts/port/build_port_index.py; using the head tool"
          fi
          python3 "$head_tool" check "${args[@]}"

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch tla2tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          curl -fsSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla/tla2tools.jar" | sha256sum --check --strict

      - name: Check TLA+ models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla/tla2tools.jar
        run: scripts/formal/run_tlc.sh

      - name: Library import invariant mutation coverage
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla/tla2tools.jar
          FORMAL_MUTATION_OUTPUT: ${{ runner.temp }}/library-import-mutations
        run: python3 scripts/formal/check_library_import_mutations.py

      - name: Retain library import mutation TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-import-mutation-tlc
          path: ${{ runner.temp }}/library-import-mutations
          if-no-files-found: warn
