name: plan-guards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROTECTED_PATHS: >-
    tests/golden tests/fixtures tests/baseline.json docs/formal
    docs/port/surface-parity.tsv

jobs:
  inventory-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frozen snapshot and dependency pin are unconditionally immutable
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" HEAD -- legacy oracle-lock)
          if [ -n "$changed" ]; then
            echo "::error::legacy/ and oracle-lock/ are frozen; no label overrides this."
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Oracle artifacts require an explicit oracle-change PR
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'oracle-change')
        run: |
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" HEAD -- $PROTECTED_PATHS)
          if [ -n "$changed" ]; then
            echo "::error::Protected oracle artifacts changed. Use a separate oracle-change PR with a second reviewer."
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Inventory is reproducible
        run: |
          python3 scripts/port/scan_legacy.py --format md > /tmp/inventory.md
          diff -u docs/port/01-INVENTORY.generated.md /tmp/inventory.md

      - name: Parity ledger is valid
        run: python3 scripts/port/check_parity.py

      - name: Port index generator tests
        run: python3 -m unittest discover -s scripts/port -p 'test_*.py'

      - name: Port aggregates are generated from unit shards
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # The migration PR that first adds docs/port/units is the parent aggregate
          # change. Afterwards an aggregate edit must come with a coordination-file
          # edit from the exact contract paths, and the reproducible check below
          # proves the aggregate is the generated output. README-only edits and
          # misnamed files do not count as a shard change.
          if git cat-file -e "$base:docs/port/units" 2>/dev/null; then
            aggregates=$(git diff --name-only \
              "$base" HEAD -- docs/port/queue.tsv docs/port/ledger.tsv)
            if [ -n "$aggregates" ]; then
              shards=$(git diff --name-only "$base" HEAD -- \
                ':(glob)docs/port/units/*.queue.tsv' \
                ':(glob)docs/port/units/*.ledger.tsv' \
                ':(glob)docs/port/units/removed.tsv')
              if [ -z "$shards" ]; then
                echo "::error::queue.tsv and ledger.tsv are generated; change a unit shard or removed.tsv and rerun build."
                printf '%s\n' "$aggregates"
                exit 1
              fi
            fi
          fi

      - name: Port index is current and history is preserved
        run: |
          ref="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$ref" ] && ! printf '%s' "$ref" | grep -Eq '^0+$'; then
            if git cat-file -e "$ref:docs/port/units" 2>/dev/null; then
              python3 scripts/port/build_port_index.py check --against "$ref"
            else
              echo "::notice::base $ref predates docs/port/units; acknowledging the migration-only history skip"
              python3 scripts/port/build_port_index.py check --against "$ref" --allow-pre-migration-base
            fi
          else
            python3 scripts/port/build_port_index.py check
          fi

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch tla2tools
        run: |
          mkdir -p "$RUNNER_TEMP/tla"
          curl -sSL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Check TLA+ models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla/tla2tools.jar
        run: scripts/formal/run_tlc.sh
