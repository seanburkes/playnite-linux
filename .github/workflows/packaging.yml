name: packaging

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: AppImage
            job_name: AppImage packaging smoke
            runner: ubuntu-24.04
            rid: linux-x64
            arch: x86_64
          - format: AppImage
            job_name: AppImage ARM64 packaging smoke
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            arch: aarch64
          - format: Flatpak
            job_name: Flatpak packaging smoke
            runner: ubuntu-24.04
            rid: linux-x64
            arch: x86_64
          - format: Flatpak
            job_name: Flatpak ARM64 packaging smoke
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            arch: aarch64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish the existing shell and CLI; assemble package inputs
        run: bash packaging/assemble.sh "$RUNNER_TEMP/package" "${{ matrix.rid }}"
      - name: Test packaging validation and launcher routing
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Build and smoke the AppImage
        if: matrix.format == 'AppImage'
        working-directory: ${{ runner.temp }}/package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          case "$TARGET_ARCH" in
            x86_64)
              tool_sha='ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
              runtime_sha='2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
              ;;
            aarch64)
              tool_sha='f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158'
              runtime_sha='00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444'
              ;;
            *)
              echo "Unsupported AppImage architecture: $TARGET_ARCH" >&2
              exit 1
              ;;
          esac
          curl --fail --location --retry 3 -o appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${TARGET_ARCH}.AppImage"
          curl --fail --location --retry 3 -o "runtime-${TARGET_ARCH}" "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${TARGET_ARCH}"
          printf '%s  appimagetool.AppImage\n' "$tool_sha" | sha256sum --check --strict
          printf '%s  runtime-%s\n' "$runtime_sha" "$TARGET_ARCH" | sha256sum --check --strict
          chmod +x appimagetool.AppImage
          mkdir artifacts
          ARCH="$TARGET_ARCH" ./appimagetool.AppImage --appimage-extract-and-run --no-appstream --runtime-file "runtime-${TARGET_ARCH}" AppDir "artifacts/Playnite-Linux-${TARGET_ARCH}.AppImage"
          image="$RUNNER_TEMP/package/artifacts/Playnite-Linux-${TARGET_ARCH}.AppImage"
          test -s "$image"
          version=$(timeout 30s "$image" --appimage-extract-and-run --version)
          printf 'Packaged CLI version: %s\n' "$version"
          test "$version" = '1.0.0.0'
          timeout 30s "$image" --appimage-extract-and-run --headless --smoke
          "$image" --appimage-extract
          python3 "$GITHUB_WORKSPACE/packaging/verify-entry.py" --arch "$TARGET_ARCH" squashfs-root
          {
            echo "## AppImage ($TARGET_ARCH): PASS"
            echo "Source commit: $(cat source-commit.txt)"
            echo "appimagetool 1.9.1; type2-runtime 20251108; SDK 11.0.100; .NET runtime 11.0.0; $TARGET_RID"
            ./appimagetool.AppImage --appimage-extract-and-run --version
            sha256sum appimagetool.AppImage "runtime-${TARGET_ARCH}"
            stat --printf='Artifact: %n — %s bytes\n' "$image"
            cat squashfs-root/usr/lib/playnite/{cli,desktop}/*.runtimeconfig.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Flatpak tooling and runtime branch
        if: matrix.format == 'Flatpak'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            flatpak-builder=1.4.2-1build2 flatpak=1.14.6-1ubuntu0.1 elfutils=0.190-1.1ubuntu0.1 \
            librsvg2-common=2.58.0+dfsg-1ubuntu0.1 libgdk-pixbuf2.0-bin=2.42.10+dfsg-3ubuntu3.3
          command -v eu-strip
          eu-strip --version
          flatpak-builder --version
          flatpak --version
          test "$(flatpak-builder --version)" = 'flatpak-builder-1.4.2'
          test "$(flatpak --version)" = 'Flatpak 1.14.6'
          # Flatpak's host-side export validator needs the SVG GDK loader, not just librsvg2-2.
          gdk-pixbuf-thumbnailer -s 128 packaging/io.github.playnite_linux.Playnite.svg "$RUNNER_TEMP/icon-check.png"
          test -s "$RUNNER_TEMP/icon-check.png"
          # Ubuntu runner AppArmor otherwise blocks bubblewrap's unprivileged namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          python3 packaging/verify-flatpak.py packaging/io.github.playnite_linux.Playnite.json
          python3 -c 'import json, sys; locks=json.load(open("packaging/flatpak-runtime-lock.json"))[sys.argv[1]]; print("\n".join(f"{ref}\t{commit}" for ref, commit in locks.items()))' "$TARGET_ARCH" > "$RUNNER_TEMP/runtime-lock.tsv"
          while IFS=$'\t' read -r ref commit; do
            flatpak install --user --noninteractive --no-related --no-deps --no-static-deltas flathub "$ref"
            flatpak update --user --noninteractive --no-related --no-deps --commit="$commit" "$ref"
          done < "$RUNNER_TEMP/runtime-lock.tsv"
          python3 packaging/verify-flatpak-runtime.py --arch "$TARGET_ARCH" packaging/flatpak-runtime-lock.json 'After setup'
      - name: Build, install bundle and smoke the sandboxed Flatpak
        if: matrix.format == 'Flatpak'
        working-directory: ${{ runner.temp }}/package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          id=io.github.playnite_linux.Playnite
          verify_runtime() {
            python3 "$GITHUB_WORKSPACE/packaging/verify-flatpak-runtime.py" \
              --arch "$TARGET_ARCH" \
              "$GITHUB_WORKSPACE/packaging/flatpak-runtime-lock.json" "$1"
          }
          verify_runtime 'Before builder'
          flatpak-builder --user --disable-rofiles-fuse --repo=repo build "$id.json"
          verify_runtime 'After builder'
          mkdir artifacts
          flatpak build-bundle repo "artifacts/Playnite-Linux-${TARGET_ARCH}.flatpak" "$id"
          verify_runtime 'After build-bundle'
          test -s "artifacts/Playnite-Linux-${TARGET_ARCH}.flatpak"
          # Dependencies are already deployed from the lock; do not update them to branch tips.
          flatpak install --user --noninteractive --no-deps "artifacts/Playnite-Linux-${TARGET_ARCH}.flatpak"
          verify_runtime 'After bundle install'
          version=$(timeout 30s flatpak run --user "$id" --version)
          printf 'Packaged CLI version: %s\n' "$version"
          test "$version" = '1.0.0.0'
          timeout 30s flatpak run --user "$id" --headless --smoke
          installed=$(flatpak info --user --show-location "$id")
          python3 "$GITHUB_WORKSPACE/packaging/verify-entry.py" --arch "$TARGET_ARCH" "$installed/files" .
          flatpak info --user --show-permissions "$id" > "$RUNNER_TEMP/flatpak-permissions.ini"
          python3 "$GITHUB_WORKSPACE/packaging/verify-flatpak.py" "$id.json" "$RUNNER_TEMP/flatpak-permissions.ini"
          {
            verify_runtime 'After sandbox smoke'
            echo "## Flatpak ($TARGET_ARCH): PASS"
            echo "Source commit: $(cat source-commit.txt)"
            echo "flatpak-builder 1.4.2-1build2; Flatpak 1.14.6-1ubuntu0.1; elfutils 0.190-1.1ubuntu0.1; SDK 11.0.100; .NET runtime 11.0.0; $TARGET_RID"
            echo 'SVG loader librsvg2-common 2.58.0+dfsg-1ubuntu0.1; GDK thumbnailer 2.42.10+dfsg-3ubuntu3.3'
            stat --printf='Artifact: %n — %s bytes\n' artifacts/*.flatpak
            cat "$RUNNER_TEMP/flatpak-permissions.ini"
            cat "$installed"/files/lib/playnite/{cli,desktop}/*.runtimeconfig.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Playnite-Linux-${{ matrix.arch }}-${{ matrix.format }}
          path: ${{ runner.temp }}/package/artifacts/*
          if-no-files-found: error
