name: linux-ci

# plan-guards runs alongside this workflow on the same unfiltered events. It
# owns inventory/parity, protected paths, port-index validation, and TLC.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  linux-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the policy base commit
        id: policy_base
        run: |
          base=$(python3 scripts/ci/resolve_base_sha.py \
            --event "${{ github.event_name }}" \
            --pull-request-base "${{ github.event.pull_request.base.sha }}" \
            --merge-group-base "${{ github.event.merge_group.base_sha }}" \
            --push-before "${{ github.event.before }}")
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Capture the committed policy baseline
        id: policy_baseline
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::notice::No base commit for this first push; first-baseline policy applies"
            printf 'baseline_state=absent\nprojects_state=absent\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "$BASE_SHA:tests/baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:tests/baseline.json" > "$RUNNER_TEMP/previous-baseline.json"
            printf 'baseline_state=present\n' >> "$GITHUB_OUTPUT"
          else
            printf 'baseline_state=absent\n' >> "$GITHUB_OUTPUT"
          fi
          python3 scripts/ci/list_test_projects.py --ref "$BASE_SHA" \
            > "$RUNNER_TEMP/previous-projects.txt"
          printf 'projects_state=present\n' >> "$GITHUB_OUTPUT"

      - name: Verify the result and baseline policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Verify the exact pinned SDK is selected
        run: |
          expected=$(jq -r '.sdk.version' global.json)
          actual=$(dotnet --version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected SDK $expected from global.json; selected $actual"
            exit 1
          fi

      - name: Restore locked dependencies (warnings are errors)
        run: dotnet restore Playnite.slnx --locked-mode -warnaserror

      - name: Build Release (warnings are errors)
        run: dotnet build Playnite.slnx --configuration Release --no-restore -warnaserror

      - name: Run every new-suite test project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/tests/Playnite.Core.Tests/Playnite.Core.Tests.csproj"
          mapfile -t projects < <(find "$GITHUB_WORKSPACE/tests" -name '*.csproj' \
            -not -path '*/obj/*' -not -path '*/bin/*' | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No new-suite test projects found"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/tests/Playnite.Architecture.Tests/Playnite.Architecture.Tests.csproj" ]; then
            echo "::notice::Architecture test project is not present yet; p2-002 will add it"
          fi
          for project in "${projects[@]}"; do
            name=$(basename "$project" .csproj)
            echo "Running $name" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "$RUNNER_TEMP/linux-test-results/$name"
            exit_code=0
            dotnet test --project "$project" --configuration Release --no-build --no-restore \
              --report-xunit-trx --report-xunit-trx-filename "$name.trx" \
              --report-xunit-junit --report-xunit-junit-filename "$name.xml" \
              --results-directory "$RUNNER_TEMP/linux-test-results/$name" \
              --fail-skips on --fail-warns on || exit_code=$?
            printf '%s\n' "$exit_code" > "$RUNNER_TEMP/linux-test-results/$name/exit-code.txt"
          done
          # Only parsed exit-8 zero-case results are non-failing before new is
          # recorded in tests/baseline.json. Once recorded, zero/regressed case
          # counts fail. Every other nonzero exit and all failed/skipped cases
          # fail unconditionally; no runner exit is ignored without validation.
          # The previous committed baseline and base project list make the
          # baseline a ratchet: lowering, resetting, deleting or silently
          # dropping a project fails instead of reopening bootstrap.
          python3 scripts/ci/check_linux_test_results.py \
            --projects "${projects[@]}" \
            --results-directory "$RUNNER_TEMP/linux-test-results" \
            --baseline "$GITHUB_WORKSPACE/tests/baseline.json" \
            --previous-baseline "$RUNNER_TEMP/previous-baseline.json" \
            --previous-baseline-state "${{ steps.policy_baseline.outputs.baseline_state }}" \
            --previous-projects "$RUNNER_TEMP/previous-projects.txt" \
            --previous-projects-state "${{ steps.policy_baseline.outputs.projects_state }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: ${{ runner.temp }}/linux-test-results/**
          if-no-files-found: warn
