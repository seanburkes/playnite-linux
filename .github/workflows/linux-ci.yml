name: linux-ci

# plan-guards runs alongside this workflow on the same unfiltered events. It
# owns inventory/parity, protected paths, port-index validation, and TLC.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  linux-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the comparison base commit
        id: policy_base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) event_base="$PULL_REQUEST_BASE" ;;
            merge_group) event_base="$MERGE_GROUP_BASE" ;;
            push) event_base="$PUSH_BEFORE" ;;
            *)
              echo "::error::Unsupported event $EVENT_NAME; cannot resolve a policy base"
              exit 1
              ;;
          esac
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$event_base" ] || printf '%s' "$event_base" | grep -Eq '^0+$'; then
              event_base=""
            fi
          elif [ -z "$event_base" ] || printf '%s' "$event_base" | grep -Eq '^0+$'; then
            echo "::error::$EVENT_NAME event has no usable base SHA; refusing to open the first-baseline path"
            exit 1
          fi
          if [ -n "$event_base" ]; then
            if ! git cat-file -e "$event_base^{commit}" 2>/dev/null; then
              echo "::error::Event base $event_base is not a commit in this checkout"
              exit 1
            fi
            if ! fork=$(git merge-base "$event_base" HEAD); then
              echo "::error::Cannot compute the fork point of $event_base and HEAD"
              exit 1
            fi
            if [ -z "$fork" ]; then
              echo "::error::Cannot compute the fork point of $event_base and HEAD"
              exit 1
            fi
          else
            fork=""
          fi
          printf 'sha=%s\nrecorded=%s\n' "$fork" "$event_base" >> "$GITHUB_OUTPUT"

      - name: Select the policy materialiser
        id: policy_materialiser
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && \
             git cat-file -e "$BASE_SHA:scripts/ci/materialise_policy.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/materialise_policy.sh" \
              > "$RUNNER_TEMP/materialise_policy.sh"
            printf 'path=%s\n' "$RUNNER_TEMP/materialise_policy.sh" >> "$GITHUB_OUTPUT"
            printf 'source=base\n' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BOOTSTRAP: base commit has no scripts/ci/materialise_policy.sh; using the head materialiser for this transition only"
            printf 'path=%s\n' "scripts/ci/materialise_policy.sh" >> "$GITHUB_OUTPUT"
            printf 'source=head\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialise the base policy scripts
        id: policy_scripts
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
          MATERIALISER: ${{ steps.policy_materialiser.outputs.path }}
        run: |
          bash "$MATERIALISER" "$BASE_SHA" "$RUNNER_TEMP" "$GITHUB_OUTPUT"

      - name: Capture the committed policy baseline
        id: policy_baseline
        shell: bash
        env:
          BASE_SHA: ${{ steps.policy_base.outputs.sha }}
          CAPTURE: ${{ steps.policy_scripts.outputs.capture }}
          LISTER: ${{ steps.policy_scripts.outputs.lister }}
        run: |
          bash "$CAPTURE" "$BASE_SHA" "$RUNNER_TEMP" "$GITHUB_OUTPUT" "$LISTER"

      - name: Verify the result and baseline policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Verify the exact pinned SDK is selected
        run: |
          expected=$(jq -r '.sdk.version' global.json)
          actual=$(dotnet --version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected SDK $expected from global.json; selected $actual"
            exit 1
          fi

      - name: Verify generated localisation artifacts against the frozen oracle
        run: python3 scripts/loc/generate_english.py --check

      - name: Restore locked dependencies (warnings are errors)
        run: dotnet restore Playnite.slnx --locked-mode -warnaserror

      - name: Build Release (warnings are errors)
        run: dotnet build Playnite.slnx --configuration Release --no-restore -warnaserror

      - name: Run every new-suite test project
        shell: bash
        env:
          PREVIOUS_BASELINE_STATE: ${{ steps.policy_baseline.outputs.baseline_state }}
          PREVIOUS_PROJECTS_STATE: ${{ steps.policy_baseline.outputs.projects_state }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/tests/Playnite.Core.Tests/Playnite.Core.Tests.csproj"
          mapfile -t projects < <(python3 scripts/ci/list_test_projects.py \
            --worktree "$GITHUB_WORKSPACE")
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No new-suite test projects found"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/tests/Playnite.Architecture.Tests/Playnite.Architecture.Tests.csproj" ]; then
            echo "::notice::Architecture test project is not present yet; p2-002 will add it"
          fi
          for project in "${projects[@]}"; do
            name=$(basename "$project" .csproj)
            echo "Running $name" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "$RUNNER_TEMP/linux-test-results/$name"
            exit_code=0
            dotnet test --project "$project" --configuration Release --no-build --no-restore \
              --report-xunit-trx --report-xunit-trx-filename "$name.trx" \
              --report-xunit-junit --report-xunit-junit-filename "$name.xml" \
              --results-directory "$RUNNER_TEMP/linux-test-results/$name" \
              --fail-skips on --fail-warns on || exit_code=$?
            printf '%s\n' "$exit_code" > "$RUNNER_TEMP/linux-test-results/$name/exit-code.txt"
          done
          # Only parsed exit-8 zero-case results are non-failing before new is
          # recorded in tests/baseline.json. Once recorded, zero/regressed case
          # counts fail. Every other nonzero exit and all failed/skipped cases
          # fail unconditionally; no runner exit is ignored without validation.
          # The previous committed baseline and base project list make the
          # baseline a ratchet: lowering, resetting, deleting or silently
          # dropping a project fails instead of reopening bootstrap.
          python3 "${{ steps.policy_scripts.outputs.checker }}" \
            --projects "${projects[@]}" \
            --results-directory "$RUNNER_TEMP/linux-test-results" \
            --baseline "$GITHUB_WORKSPACE/tests/baseline.json" \
            --previous-baseline "$RUNNER_TEMP/previous-baseline.json" \
            --previous-projects "$RUNNER_TEMP/previous-projects.txt" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Fuzz the serialisation parsers (bounded)
        shell: bash
        env:
          FUZZ_SECONDS: "120"
          FUZZ_ITERATIONS: "50000000"
          FUZZ_SEED: "0x5EED1A2B003C004D"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/serialisation-fuzz.log"
          set +e
          timeout --signal=TERM --kill-after=10s 150s \
            dotnet tools/Playnite.Fuzz/bin/Release/net11.0/Playnite.Fuzz.dll \
              --corpus tests/fixtures/serialization-fuzz \
              --seed "$FUZZ_SEED" \
              --seconds "$FUZZ_SECONDS" \
              --iterations "$FUZZ_ITERATIONS" \
              --case-timeout-ms 2000 \
              --max-input-bytes 65536 \
              --max-memory-mb 256 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Serialisation fuzz target failed with exit $status: crash, unhandled exception, hang, memory growth or budget overrun."
            exit "$status"
          fi
          if ! grep -q '^FUZZ COMPLETE ' "$log"; then
            echo "::error::Serialisation fuzz target exited without the FUZZ COMPLETE marker; the budget was not exhausted cleanly."
            exit 1
          fi
          grep '^FUZZ COMPLETE ' "$log" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Xvfb for native window smoke
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth libice6 libsm6 libfontconfig1

      - name: Open and close the native Avalonia window under Xvfb
        run: timeout 30s xvfb-run -a dotnet src/Playnite.Desktop/bin/Release/net11.0/Playnite.Desktop.dll --smoke

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: ${{ runner.temp }}/linux-test-results/**
          if-no-files-found: warn
